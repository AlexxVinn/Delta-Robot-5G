<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEMA 17 motor simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <h1>NEMA 17</h1>
    <p class="sub">
      Torque–speed model for the BOM motor class. Hover <span class="help-inline">?</span> for definitions. Gauge tick: low · OK · high.
    </p>

    <h2>Preset</h2>
    <select id="preset"></select>

    <h2>Electrical</h2>
    <label class="field" data-key="voltageV">
      <span class="name">Bus voltage <button type="button" class="help" data-key="voltageV">?</button></span>
      <span class="val" id="v-v">48</span>
      <input id="voltage" type="range" min="12" max="52" step="1" value="48" />
      <div class="gauge"><i></i></div>
    </label>
    <label class="field" data-key="ratedCurrentA">
      <span class="name">Rated current <button type="button" class="help" data-key="ratedCurrentA">?</button></span>
      <span class="val" id="v-i">2.00</span>
      <input id="current" type="range" min="0.8" max="3.0" step="0.05" value="2.0" />
      <div class="gauge"><i></i></div>
    </label>
    <label class="field" data-key="resistanceOhm">
      <span class="name">Phase R <button type="button" class="help" data-key="resistanceOhm">?</button></span>
      <span class="val" id="v-r">1.15</span>
      <input id="resistance" type="range" min="0.4" max="4.0" step="0.05" value="1.15" />
      <div class="gauge"><i></i></div>
    </label>
    <label class="field" data-key="inductancemH">
      <span class="name">Phase L <button type="button" class="help" data-key="inductancemH">?</button></span>
      <span class="val" id="v-l">1.60</span>
      <input id="inductance" type="range" min="0.8" max="6.0" step="0.05" value="1.6" />
      <div class="gauge"><i></i></div>
    </label>

    <h2>Mechanical</h2>
    <label class="field" data-key="holdTorqueNm">
      <span class="name">Holding torque <button type="button" class="help" data-key="holdTorqueNm">?</button></span>
      <span class="val" id="v-th">0.45</span>
      <input id="holdTorque" type="range" min="0.2" max="0.75" step="0.01" value="0.45" />
      <div class="gauge"><i></i></div>
    </label>
    <label class="field" data-key="inertiaGcm2">
      <span class="name">Rotor inertia <button type="button" class="help" data-key="inertiaGcm2">?</button></span>
      <span class="val" id="v-j">54</span>
      <input id="inertia" type="range" min="30" max="95" step="1" value="54" />
      <div class="gauge"><i></i></div>
    </label>
    <label class="field" data-key="bodyLenMm">
      <span class="name">Body length <button type="button" class="help" data-key="bodyLenMm">?</button></span>
      <span class="val" id="v-len">48</span>
      <input id="bodyLen" type="range" min="34" max="60" step="1" value="48" />
      <div class="gauge"><i></i></div>
    </label>
    <label class="field" data-key="microsteps">
      <span class="name">Microsteps <button type="button" class="help" data-key="microsteps">?</button></span>
      <span class="val" id="v-ms">16</span>
      <input id="microsteps" type="range" min="1" max="64" step="1" value="16" />
      <div class="gauge"><i></i></div>
    </label>

    <h2>Operating point</h2>
    <label class="field" data-key="speedRps">
      <span class="name">Speed <button type="button" class="help" data-key="speedRps">?</button></span>
      <span class="val" id="v-spd">5.0</span>
      <input id="speed" type="range" min="0" max="30" step="0.1" value="5" />
      <div class="gauge"><i></i></div>
    </label>

    <div class="status" id="stats"></div>
    <div class="verdict" id="verdict"></div>
  </aside>

  <main class="main">
    <section class="panel view3d">
      <header>3D model</header>
      <div id="three"></div>
    </section>
    <section class="panel chart">
      <header>torque vs speed</header>
      <canvas id="curve"></canvas>
    </section>
  </main>

  <div id="tooltip" hidden></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
