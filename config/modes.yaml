# Motion mode profiles — consumed by the host planner (ADR-0004).
# Units: mm, s, g (1 g ≈ 9810 mm/s²).

modes:
  speed:
    id: 0
    description: "Tracking / catching — high accel, blend-through, prediction-first"
    max_vel_mm_s: 1500.0
    max_accel_g: 3.0
    max_jerk_mm_s3: 2.0e8
    path_blend: true
    settle_dwell_ms: 0
    vision:
      use_prediction: true
      predict_horizon_ms: 40
      confirm_before_place: false

  precise:
    id: 1
    description: "Placement — low accel, S-curve, settle before release"
    max_vel_mm_s: 400.0
    max_accel_g: 0.8
    max_jerk_mm_s3: 2.0e7
    path_blend: false
    settle_dwell_ms: 40
    vision:
      use_prediction: false
      predict_horizon_ms: 0
      confirm_before_place: true

default_mode: "precise"   # commission in Precise; switch to Speed after bring-up ladder
