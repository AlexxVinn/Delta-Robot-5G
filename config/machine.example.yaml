# Example machine configuration.
# Copy to machine.yaml and fill measured values.
# machine.yaml is gitignored — never commit calibrated secrets/offsets you care about leaking;
# more importantly, don't overwrite a teammate's calibration by accident.

meta:
  name: "delta-proto-1"
  bom_version: "1.0"
  protocol_version: 1

frames:
  # true = tool +Z points toward the work surface (pick-and-place convenience)
  z_down_tool: true
  # hand-eye / camera frame filled after calibration
  camera_to_base_mm: [0.0, 0.0, 0.0]   # TBD after hand-eye
  camera_to_base_rpy_rad: [0.0, 0.0, 0.0]

geometry:
  # millimeters — measure on the real frame; placeholders are structurally plausible only
  base_side_mm: 200.0          # TBD
  effector_side_mm: 60.0       # TBD
  upper_arm_mm: 120.0          # TBD (motor axis → elbow)
  forearm_mm: 280.0            # TBD (matched CF rods)

transmission:
  ratio: 3.0                   # N = motor rev / joint rev — freeze after scripts/dynamic_model.py
  motor_steps_per_rev: 200
  microsteps: 16
  pulley_motor_teeth: 20
  # arm sector effective teeth = motor_teeth * ratio

joints:
  count: 3
  # rad; added after homing. Positive = upper arm downward (see docs/kinematics.md)
  home_offset_rad: [0.0, 0.0, 0.0]
  # soft limits in joint space (rad)
  min_rad: [-1.2, -1.2, -1.2]
  max_rad: [1.2, 1.2, 1.2]

motors:
  # Must match the physical NEMA17s you bought (see docs/BOM.md §4)
  rated_current_ma: 2000
  hold_current_ma: 800
  inductance_mH: 1.6           # TBD from datasheet
  holding_torque_nm: 0.45      # TBD from datasheet
  rotor_inertia_kg_m2: 5.5e-6  # TBD (~55 g·cm² → 5.5e-6 kg·m²)
  supply_v: 48.0

drivers:
  type: "TMC5160"
  sense_res_ohm: 0.05          # TBD per carrier
  stallguard_threshold: 8      # tune on machine

serial:
  # Host-side device; MCU uses USB-CDC baud in firmware config
  port: "/dev/ttyUSB0"
  baud: 921600
  stream_timeout_ms: 50
  stream_rate_hz: 200

workspace:
  # Conservative box in tool frame (mm) — tighten after FK workspace map
  x_min_mm: -80.0
  x_max_mm: 80.0
  y_min_mm: -80.0
  y_max_mm: 80.0
  z_min_mm: 150.0
  z_max_mm: 320.0
