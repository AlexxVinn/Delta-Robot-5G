; ESP32 step executor — see docs/architecture.md
; Build: cd firmware && pio run

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -Isrc
  -DCORE_DEBUG_LEVEL=1
  -DDELTA_PROTOCOL_VERSION=1
lib_deps =
  teemuatlut/TMCStepper@^0.7.3

; Optional: native host-side smoke for pure logic later
; [env:native]
; platform = native
